<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦向未莱游戏中心 · 官方更新站</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 16% 15%,#4b267c 0,transparent 35%),radial-gradient(circle at 80% 85%,#392460 0,transparent 38%),#100a1c;color:#eee7ff;font:16px/1.8 "Microsoft YaHei",system-ui,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(720px,100%);background:linear-gradient(140deg,#28163e,#171026);border:1px solid #7351a0;border-radius:26px;padding:clamp(24px,5vw,48px);box-shadow:0 20px 70px #0007}.tag{display:inline-block;border:1px solid #8f6ac5;color:#d7bafa;background:#5c388133;border-radius:99px;padding:4px 14px;font-size:13px}h1{font-size:clamp(26px,5vw,42px);line-height:1.25;margin:23px 0 12px;background:linear-gradient(120deg,#fff,#dfc8ff,#a577ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:#c3b5d9}.pill{margin:28px 0;border:1px solid #6a4c93;background:#3b2753;border-radius:14px;padding:18px}.label{font-size:13px;color:#bfacd9}.value{font-size:23px;font-weight:800;line-height:1.4}.row{display:flex;gap:20px;flex-wrap:wrap}.row>div{flex:1;min-width:180px}a{color:#e3c5ff;overflow-wrap:anywhere}footer{color:#9c8ab8;font-size:13px;margin-top:26px}
</style></head><body><main class="wrap"><div class="tag">✦ MAI XIANG WEI LAI · OFFICIAL UPDATES</div><h1>麦向未莱游戏中心</h1><div class="sub">官方游戏内容更新站 · 通过 HTTPS 分发数字签名验证的游戏更新</div><section class="pill"><div id="state">正在检查更新清单…</div><div class="row" style="margin-top:12px"><div><div class="label">线上版本</div><div class="value" id="version">—</div></div><div><div class="label">可更新文件</div><div class="value" id="files">—</div></div></div><div class="label" id="notes" style="margin-top:12px"></div></section><p>使用软件内的「在线更新」功能即可检查新版本；本网站不收集用户账号、密码或游戏存档。</p><p>更新清单：<a href="./manifest.json">manifest.json</a></p><footer>此页面仅提供静态文件分发，实际更新需要在客户端完成签名和哈希校验。</footer></main><script>
fetch('./manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(m=>{document.getElementById('state').textContent='✓ 更新清单可访问';document.getElementById('version').textContent=String(m.version||'未知');document.getElementById('files').textContent=Array.isArray(m.files)?String(m.files.length):'—';document.getElementById('notes').textContent=String(m.notes||'');}).catch(e=>{document.getElementById('state').textContent='× 无法读取更新清单：'+e.message});
</script></body></html>
